<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="680" viewBox="0 0 1050 680" font-family="Helvetica, Arial, sans-serif">
  <rect width="1050" height="680" fill="#0f172a"/>
  <text x="525" y="28" fill="#f1f5f9" font-size="16" font-weight="bold" text-anchor="middle">SomNet Solutions — DHCP Server &amp; Relay (Lab 13)</text>

  <!-- HQ-R1 as DHCP server -->
  <rect x="150" y="70" width="200" height="110" rx="8" fill="#1e293b" stroke="#facc15" stroke-width="2.5"/>
  <text x="250" y="93" fill="#e2e8f0" font-size="14" font-weight="bold" text-anchor="middle">HQ-R1</text>
  <text x="250" y="109" fill="#4ade80" font-size="10" font-weight="bold" text-anchor="middle">★ DHCP SERVER ★</text>
  <text x="250" y="124" fill="#94a3b8" font-size="8.5" text-anchor="middle">Pool: HR-POOL (10.0/29)</text>
  <text x="250" y="136" fill="#94a3b8" font-size="8.5" text-anchor="middle">Pool: SALES-POOL (20.0/28)</text>
  <text x="250" y="148" fill="#94a3b8" font-size="8.5" text-anchor="middle">Pool: BRANCH-POOL (30.0/29)</text>
  <text x="250" y="163" fill="#94a3b8" font-size="8.5" text-anchor="middle">Gi0/1: 192.168.100.1</text>

  <!-- BRANCH-R1 as relay -->
  <rect x="700" y="70" width="200" height="110" rx="8" fill="#1e293b" stroke="#facc15" stroke-width="2.5"/>
  <text x="800" y="93" fill="#e2e8f0" font-size="14" font-weight="bold" text-anchor="middle">BRANCH-R1</text>
  <text x="800" y="109" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">↻ DHCP RELAY ↻</text>
  <text x="800" y="124" fill="#94a3b8" font-size="8.5" text-anchor="middle">Gi0/0: ip helper-address</text>
  <text x="800" y="136" fill="#94a3b8" font-size="8.5" text-anchor="middle">→ 192.168.100.1</text>
  <text x="800" y="151" fill="#94a3b8" font-size="8.5" text-anchor="middle">Gi0/1: 192.168.100.2</text>
  <text x="800" y="163" fill="#94a3b8" font-size="8.5" text-anchor="middle">Gi0/0: 192.168.30.1</text>

  <!-- WAN link -->
  <line x1="350" y1="115" x2="700" y2="115" stroke="#22c55e" stroke-width="3.5"/>
  <text x="525" y="105" fill="#22c55e" font-size="11" font-weight="bold" text-anchor="middle">192.168.100.0/30</text>
  <text x="525" y="135" fill="#f87171" font-size="10" font-style="italic" text-anchor="middle">broadcast → unicast relay</text>

  <!-- HQ switches -->
  <rect x="60" y="220" width="150" height="65" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="135" y="242" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">HQ-SW1</text>
  <text x="135" y="256" fill="#a78bfa" font-size="8.5" text-anchor="middle">ROOT BRIDGE</text>
  <text x="135" y="268" fill="#94a3b8" font-size="8.5" text-anchor="middle">Vlan99: .99.1</text>
  <line x1="250" y1="180" x2="160" y2="220" stroke="#facc15" stroke-width="2"/>

  <rect x="230" y="220" width="130" height="65" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="295" y="242" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">HQ-SW2</text>
  <text x="295" y="256" fill="#94a3b8" font-size="8.5" text-anchor="middle">Vlan99: .99.2</text>
  <line x1="210" y1="252" x2="230" y2="252" stroke="#22c55e" stroke-width="4"/>

  <!-- Branch switch -->
  <rect x="730" y="220" width="150" height="65" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="805" y="242" fill="#e2e8f0" font-size="12" font-weight="bold" text-anchor="middle">BRANCH-SW1</text>
  <text x="805" y="256" fill="#94a3b8" font-size="8.5" text-anchor="middle">Vlan30, Vlan99</text>
  <text x="805" y="268" fill="#94a3b8" font-size="8.5" text-anchor="middle">Vlan99: .199.1</text>
  <line x1="800" y1="180" x2="805" y2="220" stroke="#facc15" stroke-width="2"/>

  <!-- HQ PCs -->
  <g><rect x="20" y="340" width="70" height="55" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/><text x="55" y="362" fill="#e2e8f0" font-size="10" text-anchor="middle">PC1 HR</text><text x="55" y="376" fill="#4ade80" font-size="8.5" text-anchor="middle">DHCP</text></g>
  <g><rect x="100" y="340" width="70" height="55" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/><text x="135" y="362" fill="#e2e8f0" font-size="10" text-anchor="middle">PC2 HR</text><text x="135" y="376" fill="#4ade80" font-size="8.5" text-anchor="middle">DHCP</text></g>
  <g><rect x="180" y="340" width="70" height="55" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/><text x="215" y="362" fill="#e2e8f0" font-size="10" text-anchor="middle">PC3 Sales</text><text x="215" y="376" fill="#4ade80" font-size="8.5" text-anchor="middle">DHCP</text></g>
  <line x1="55" y1="340" x2="120" y2="285" stroke="#64748b" stroke-width="1"/>
  <line x1="135" y1="340" x2="140" y2="285" stroke="#64748b" stroke-width="1"/>
  <line x1="215" y1="340" x2="160" y2="285" stroke="#64748b" stroke-width="1"/>

  <g><rect x="290" y="340" width="70" height="55" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/><text x="325" y="362" fill="#e2e8f0" font-size="10" text-anchor="middle">PC5 HR</text><text x="325" y="376" fill="#4ade80" font-size="8.5" text-anchor="middle">DHCP</text></g>
  <g><rect x="370" y="340" width="70" height="55" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/><text x="405" y="362" fill="#e2e8f0" font-size="10" text-anchor="middle">PC6 Sales</text><text x="405" y="376" fill="#4ade80" font-size="8.5" text-anchor="middle">DHCP</text></g>
  <line x1="325" y1="340" x2="280" y2="285" stroke="#64748b" stroke-width="1"/>
  <line x1="405" y1="340" x2="300" y2="285" stroke="#64748b" stroke-width="1"/>

  <!-- Branch PCs -->
  <g><rect x="750" y="340" width="70" height="55" rx="6" fill="#1e293b" stroke="#a3e635" stroke-width="1.5"/><text x="785" y="362" fill="#e2e8f0" font-size="10" text-anchor="middle">PC7</text><text x="785" y="376" fill="#4ade80" font-size="8.5" text-anchor="middle">DHCP (relayed)</text></g>
  <g><rect x="830" y="340" width="70" height="55" rx="6" fill="#1e293b" stroke="#a3e635" stroke-width="1.5"/><text x="865" y="362" fill="#e2e8f0" font-size="10" text-anchor="middle">PC8</text><text x="865" y="376" fill="#4ade80" font-size="8.5" text-anchor="middle">DHCP (relayed)</text></g>
  <line x1="785" y1="340" x2="800" y2="285" stroke="#64748b" stroke-width="1"/>
  <line x1="865" y1="340" x2="820" y2="285" stroke="#64748b" stroke-width="1"/>

  <!-- Legend -->
  <rect x="20" y="440" width="1010" height="210" rx="10" fill="#16283f" stroke="#334155" stroke-width="1"/>
  <text x="525" y="470" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">How DHCP Relay Actually Works</text>
  <text x="525" y="500" fill="#94a3b8" font-size="11.5" text-anchor="middle">1. PC7 broadcasts "I need an IP!" (DHCP DISCOVER) — this broadcast can ONLY reach BRANCH-R1's Gi0/0, never cross the WAN on its own</text>
  <text x="525" y="523" fill="#94a3b8" font-size="11.5" text-anchor="middle">2. BRANCH-R1's ip helper-address catches that broadcast and repackages it as a normal routable UNICAST packet</text>
  <text x="525" y="546" fill="#94a3b8" font-size="11.5" text-anchor="middle">3. That unicast packet travels normally across the WAN link to HQ-R1 at 192.168.100.1</text>
  <text x="525" y="569" fill="#94a3b8" font-size="11.5" text-anchor="middle">4. HQ-R1's BRANCH-POOL answers with a lease from 192.168.30.0/29 — sent back the same relayed path</text>
  <text x="525" y="600" fill="#94a3b8" font-size="11.5" text-anchor="middle">Gateway addresses (.1) on every subnet are excluded from their pools to prevent conflicts with router interfaces</text>
  <text x="525" y="623" fill="#94a3b8" font-size="11.5" text-anchor="middle">Management VLANs remain unrouted and outside DHCP entirely — same security boundary since Lab 07</text>
</svg>
